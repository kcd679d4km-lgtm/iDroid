name: Andarium

options:
  bundleIdPrefix: com.idroid
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  AndariumCore:
    path: AndariumCore
  GuestHostCore:
    path: ../GuestHost/Core

configFiles:
  Debug: Config/Andarium.xcconfig
  Release: Config/Andarium.xcconfig

targets:
  Andarium:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Andarium/Shared
      - path: Andarium/Live
      - path: ../GuestHost/Sources
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Localization
        buildPhase: resources
      - path: ../.build/andarium-system
        type: folder
        buildPhase: resources
    dependencies:
      - package: AndariumCore
      - package: GuestHostCore
      - framework: ../.build/kernarium-xcframeworks/KRuntime_Android_6_18_4K.xcframework
        embed: true
      - framework: ../.build/kernarium-xcframeworks/MesaEGL.xcframework
        embed: true
      - framework: ../.build/kernarium-xcframeworks/MesaGallium.xcframework
        embed: true
      - framework: ../.build/kernarium-xcframeworks/LibZstd.xcframework
        embed: false
    postBuildScripts:
      - name: Embed KosmicKrisp (device only)
        script: |
          "$SRCROOT/../Kernarium/scripts/embed-device-framework.sh" "$SRCROOT/../.build/kernarium-xcframeworks/KosmicKrisp.xcframework"
    settings:
      base:
        PRODUCT_NAME: Andarium
        PRODUCT_BUNDLE_IDENTIFIER: com.idroid.app
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: "$(APP_ICON_NAME)"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Config/Andarium.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../.build/kernarium-xcframeworks"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: iDroid
        INFOPLIST_KEY_NSCameraUsageDescription: "iDroid uses the camera only when you turn on Camera, so that apps in the virtual machine can use it."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Apps running in iDroid use this to connect to devices on your local network."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "iDroid shares this device's location only when you turn on Location, so that apps in the virtual machine can use it."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "iDroid records from the microphone only when you turn on Microphone, so that apps in the virtual machine can use it."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_OTHER_PREPROCESSOR_FLAGS: "-traditional -undef"
        INFOPLIST_PREPROCESS: YES
        INFOPLIST_PREPROCESSOR_DEFINITIONS: "$(FEEDBACK_PLIST_DEFINITION) $(TIP_JAR_PLIST_DEFINITION) $(REVIEW_PLIST_DEFINITION) $(DEVELOPER_PLIST_DEFINITIONS) $(FOLLOW_X_PLIST_DEFINITION) $(ICP_PLIST_DEFINITION)"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "15"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_OBJC_BRIDGING_HEADER: Config/Andarium-Bridging-Header.h
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "5.0"
