name: Build iDroid IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix script permissions and line endings
        run: |
          find . -type f \( -name "*.sh" -o -name "*.py" \) -exec chmod +x {} +
          find dependencies -type f \( -name "*.patch" -o -name "*.tsv" -o -name "*.sh" \) -exec sed -i '' 's/\r$//' {} +
          git config --global user.name "github-actions"
          git config --global user.email "actions@users.noreply.github.com"

      - name: Select latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Using Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tools
        run: |
          brew install cmake ninja meson pkg-config autoconf automake libtool bison flex xcodegen
          python3 -m pip install --break-system-packages mako packaging pyyaml || pip3 install mako packaging pyyaml

      - name: Mount case-sensitive APFS for external/sources
        run: |
          hdiutil create -size 20g -type SPARSE -fs "Case-sensitive APFS" -volname iDroidSrc /tmp/idroid_src.sparseimage
          mkdir -p external/sources
          hdiutil attach /tmp/idroid_src.sparseimage -mountpoint external/sources

      - name: Cache built iOS dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: .build/dependencies
          key: ios-deps-${{ hashFiles('dependencies/manifest.tsv', 'dependencies/build-*.sh') }}

      - name: Prepare and build iOS dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          ./dependencies/prepare.sh --product ios-network
          ./dependencies/build-ios-network.sh --platform ios

          ./dependencies/prepare.sh --product ios-storage
          ./dependencies/build-ios-storage.sh

          ./dependencies/prepare.sh --product ios-compression
          ./dependencies/build-ios-zstd.sh

          ./dependencies/prepare.sh --product apple-gpu-vulkan-experiment
          ./dependencies/build-apple-gpu.sh --platform ios

      - name: Fetch prebuilt Android 17 (LineageOS 24) & kernel release
        run: |
          mkdir -p .build/android/releases .build/kernel/artifacts
          curl -fL --retry 3 -o /tmp/lineage24.tar.gz \
            "https://github.com/imxieyi/Kernarium/releases/download/1.0b15-release/lineage24-mainline6.18-4k-20261115-los24-r28.tar.gz"
          tar -xzf /tmp/lineage24.tar.gz -C .build/android/releases
          rm -f /tmp/lineage24.tar.gz

          curl -fL --retry 3 -o /tmp/android-kernel.tar.gz \
            "https://github.com/imxieyi/Kernarium/releases/download/1.0b15-release/android-6.18-arm64-4k-20261117-6.18.60-vd2.tar.gz"
          tar -xzf /tmp/android-kernel.tar.gz -C .build/kernel/artifacts
          rm -f /tmp/android-kernel.tar.gz

      - name: Configure and build Kernarium Android iOS runtime
        run: |
          KERNEL_DIR=$(ls -d "$PWD/.build/kernel/artifacts/android-6.18-arm64-4k-"* | head -n 1)
          echo "Using kernel artifact: $KERNEL_DIR"
          cmake --preset kernarium-ios-device-android -DUML_ANDROID17_KERNEL_ARTIFACT_DIR="$KERNEL_DIR"
          cmake --build --preset kernarium-ios-device-android
          ./Kernarium/scripts/package-ios-frameworks.sh --runtimes android

      - name: Stage Android system image
        run: |
          python3 ./Andarium/scripts/stage-system-image.py

      - name: Generate Xcode project with XcodeGen
        run: |
          cd Andarium
          rm -rf Andarium.xcodeproj
          xcodegen generate

      - name: Archive iDroid (Release, Unsigned)
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -project Andarium/Andarium.xcodeproj \
            -scheme Andarium \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/iDroid.xcarchive \
            archive \
            PRODUCT_BUNDLE_IDENTIFIER=com.idroid.app \
            INFOPLIST_KEY_CFBundleDisplayName=iDroid \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee build/xcodebuild.log || (echo "=== ERRORS ===" && grep -E "error:|fatal error:" build/xcodebuild.log | head -n 40 && exit 1)

      - name: Package iDroid.ipa
        run: |
          mkdir -p build/Payload
          cp -R "build/iDroid.xcarchive/Products/Applications/"*.app "build/Payload/iDroid.app"
          cd build
          zip -qry iDroid.ipa Payload

      - name: Upload to tmpfiles.org
        run: |
          RESPONSE=$(curl -s -F "file=@build/iDroid.ipa" https://tmpfiles.org/api/v1/upload)
          echo "tmpfiles response: $RESPONSE"
          URL=$(python3 -c "import sys, json; d=json.load(sys.stdin); print(d['data']['url'].replace('tmpfiles.org/', 'tmpfiles.org/dl/'))" <<< "$RESPONSE" || true)
          echo "Direct download URL: $URL"

      - name: Upload iDroid.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: iDroid-ipa
          path: build/iDroid.ipa
          if-no-files-found: error
